<!doctype html>
<html lang="ar" dir="rtl" data-palette="indigo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#000000" />
  <title>لم المتراكم — خطوة بخطوة نلمّ اللي فات</title>
  <meta name="description" content="لم المتراكم: منصة مذاكرة لطلاب الثانوية العامة تساعدك تلمّ المتراكم وتعرف تبدأ منين، بخطة يومية على وقتك الحقيقي." />
  <meta property="og:title" content="لم المتراكم — خطوة بخطوة نلمّ اللي فات" />
  <meta property="og:description" content="خطة يومية حقيقية مبنية على وقتك والمدة اللي عايز تخلص فيها المتراكم. الجديد محمي، والمتراكم بياخد الباقي." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ar_EG" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    try {
      var t = localStorage.getItem("lam_theme") || "dark";
      document.documentElement.dataset.theme = t;
      document.documentElement.style.colorScheme = t;
      if (localStorage.getItem("lam_motion") === "full") {
        document.documentElement.classList.add("motion-full");
      }
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
